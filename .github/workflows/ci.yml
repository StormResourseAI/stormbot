name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  UNITTEST_RUNNING: "1"

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step, on purpose. The runtime has zero dependencies and the
      # suite is stdlib-only, so there is nothing to resolve, cache, or pin here
      # and nothing that can break because an index was slow.
      - name: Run the full suite
        run: python -m unittest discover -s tests -t . -v

  byte-compile:
    name: byte-compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches a syntax error on the oldest supported interpreter before any
      # slower job spends a runner minute on it.
      - name: Compile every module
        run: python -m compileall -q src tests scripts examples

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.linux.lock.txt

      # --require-hashes: pip refuses any artifact whose digest is not in the
      # lockfile, so a substituted wheel fails the install instead of running.
      - name: Install pinned tooling
        run: pip install --require-hashes -r requirements/dev.linux.lock.txt

      - run: ruff check --output-format=github .
      - run: ruff format --check .

  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runs as its own job so a leaked credential or a committed database shows
      # up as a distinctly named red check rather than one failure among many.
      - name: Scan for secrets, contact data, and forbidden artifacts
        run: python -m unittest discover -s tests/contract -t . -v
